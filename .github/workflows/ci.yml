name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Pure-node gates. Seconds, no browser — these must stay the fastest signal.
  unit:
    name: unit (numeric / weather points / native config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Both Vite modes are built on every change: web (base=/mapping_elf/) and app
  # (base=./). A base regression only shows up in one of them (INC-278).
  build:
    name: build (web + app + chunk budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build app bundle (Capacitor base)
        run: npm run build:app
      - name: Build web bundle (Pages base)
        run: npm run build:web
      - name: Chunk split + size budget
        run: npm run test:chunks
      # dist/ is the web build; the e2e shards preview it instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist
          retention-days: 3

  # Playwright suite, sharded. Each shard previews the artifact from `build`,
  # so the bundle under test is byte-identical across shards (and to deploy).
  #
  # Two lanes: core (2 shards) and 3D terrain (1 shard, streamlined).
  # Performance budgets run within the core suite rather than spinning up an
  # isolated VM runner. Playwright browsers are cached to avoid apt mirror latency.
  e2e:
    name: e2e ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERF_BUDGET_SCALE: '3'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: core-1, name: 'core 1/2', filter: '^(?!.*terrain-3d).*\.spec\.js$', shard: '1/2' }
          - { id: core-2, name: 'core 2/2', filter: '^(?!.*terrain-3d).*\.spec\.js$', shard: '2/2' }
          - { id: 3d, name: '3D', filter: 'terrain-3d', shard: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run shard
        run: npx playwright test "${{ matrix.filter }}" --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          retention-days: 7
