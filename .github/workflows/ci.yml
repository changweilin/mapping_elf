name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Pure-node gates. Seconds, no browser ??these must stay the fastest signal.
  unit:
    name: unit (numeric / weather points / native config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Both Vite modes are built on every change: web (base=/mapping_elf/) and app
  # (base=./). A base regression only shows up in one of them (INC-278).
  build:
    name: build (web + app + chunk budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build app bundle (Capacitor base)
        run: npm run build:app
      - name: Build web bundle (Pages base)
        run: npm run build:web
      - name: Chunk split + size budget
        run: npm run test:chunks
      # dist/ is the web build; the e2e shards preview it instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist
          retention-days: 3

  # Minimal browser gate: app shell, cache versioning, bottom bar, import/export.
  # Heavy suites (terrain-3d WebGL, star-magic-circle, catchment, shape-route,
  # perf) pass locally in seconds but take minutes on shared runners and caused
  # timeouts/flaky failures; run them locally via `npm run test:e2e`.
  e2e:
    name: e2e smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run smoke specs
        run: npx playwright test test/smoke.spec.js test/cache-versioning.spec.js test/bottom-bar-icon-toggles.spec.js test/import-export.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
