name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Pure-node gates. Seconds, no browser — these must stay the fastest signal.
  unit:
    name: unit (numeric / weather points / native config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Both Vite modes are built on every change: web (base=/mapping_elf/) and app
  # (base=./). A base regression only shows up in one of them (INC-278).
  build:
    name: build (web + app + chunk budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build app bundle (Capacitor base)
        run: npm run build:app
      - name: Build web bundle (Pages base)
        run: npm run build:web
      - name: Chunk split + size budget
        run: npm run test:chunks
      # dist/ is the web build; the e2e shards preview it instead of rebuilding.
      # (the sw precache-version guard, INC-251, runs in e2e via cache-versioning.spec.js)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist
          retention-days: 3

  # Playwright suite, sharded. Each shard previews the artifact from `build`,
  # so the bundle under test is byte-identical across shards (and to deploy).
  #
  # Two lanes, because the 3D suite is an order of magnitude heavier per test
  # (~45-90 s vs ~5-15 s). Playwright hands shards CONTIGUOUS slices of the test
  # list, so a plain --shard=n/4 kept dropping all 20 terrain tests into one job:
  # 29 min against another shard's 2 min, and still 17.6 min once the failures
  # were fixed. Splitting the lanes by file makes the balance deterministic
  # instead of hoping the slice boundary lands in the right place — the two 3D
  # shards and the three core shards all come in around 7 min.
  #
  # The positional argument is a regex matched against the spec's file path; the
  # lookahead is how the core lane says "everything except the 3D files". Both
  # lanes still need `fullyParallel` (playwright.config.js) to split per test —
  # the 3D lane is only two files.
  #
  # timeout-minutes is a guardrail, not a budget: if a lane approaches it, split
  # or trim the suite rather than raising the number.
  e2e:
    name: e2e ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: core-1, name: 'core 1/3', filter: '^(?!.*terrain-3d).*\.spec\.js$', shard: '1/3' }
          - { id: core-2, name: 'core 2/3', filter: '^(?!.*terrain-3d).*\.spec\.js$', shard: '2/3' }
          - { id: core-3, name: 'core 3/3', filter: '^(?!.*terrain-3d).*\.spec\.js$', shard: '3/3' }
          - { id: 3d-1, name: '3D 1/2', filter: 'terrain-3d', shard: '1/2' }
          - { id: 3d-2, name: '3D 2/2', filter: 'terrain-3d', shard: '2/2' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run shard
        run: npx playwright test "${{ matrix.filter }}" --shard=${{ matrix.shard }} --grep-invert "@perf"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Import/render budgets. Runner hardware is slower and noisier than a dev box,
  # so the budgets are scaled — a failure here means a real order-of-magnitude
  # regression, not a slow runner.
  perf:
    name: perf budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PERF_BUDGET_SCALE: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep "@perf"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-perf
          path: |
            playwright-report
            test-results
          retention-days: 7
