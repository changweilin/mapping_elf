name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pre-deploy gates. Cheap, and each one guards a shipped-breakage incident:
      # numeric regressions, native/config drift, the app-mode base (INC-278),
      # and the chunk split wired into vite.config.js.
      - name: Node gates
        run: npm run test:unit

      - name: Build app bundle (base=./, must not break with the web build)
        run: npm run build:app

      - name: Build web bundle (base=/mapping_elf/)
        run: npm run build:web

      - name: Chunk split + size budget
        run: npm run test:chunks

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
